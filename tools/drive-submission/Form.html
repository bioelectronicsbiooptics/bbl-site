<!doctype html><html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:20px;color:#16324f;font:16px/1.7 system-ui,sans-serif;background:white}h2{font-size:22px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:650}input{width:100%;padding:10px;border:1px solid #9cb1c8;border-radius:7px;font:inherit}.wide{grid-column:1/-1}button{padding:11px 18px;border:0;border-radius:7px;background:#16324f;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere}.note{color:#56697b;font-size:14px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><h2>이름·학번·FASTA 제출</h2><form id="form"><div class="grid"><div><label for="name">학생 이름</label><input id="name" name="student_name" required maxlength="60" autocomplete="name"></div><div><label for="id">학번</label><input id="id" name="student_id" required maxlength="40"></div><div class="wide"><label for="file">Encoding 결과 FASTA</label><input id="file" name="fasta" type="file" accept=".fasta,.fa,.fna" required><span class="note">최대 20 MB · 각 가닥 148 nt</span></div></div><input name="request_id" id="request" type="hidden"><p><button id="send" type="submit">제출</button></p><p id="status" role="status" aria-live="polite"></p><p><a id="week12" target="_top" hidden>12주차 FASTQ 받기 →</a></p></form><script>
const form=document.getElementById('form'),button=document.getElementById('send'),status=document.getElementById('status');let busy=false;
const newRequest=()=>document.getElementById('request').value=crypto.randomUUID();newRequest();form.addEventListener('change',()=>{if(!busy)newRequest();});
function generation(student,info){
 if(info&&info.status==='ready'){status.textContent+='\nFASTQ 생성 완료 · 12주차 링크에서 받을 수 있습니다.';return;}
 status.textContent+='\nFASTQ 생성 중입니다. 이 화면을 닫아도 12주차 새로고침으로 이어갈 수 있습니다.';
 google.script.run.withSuccessHandler(next=>{if(next.status==='ready'){status.textContent+='\nFASTQ 생성 완료';return;}setTimeout(()=>generation(student,next),1500);}).withFailureHandler(error=>{status.textContent+='\nFASTQ: '+error.message+' · 12주차에서 새로고침해 주세요.';}).refreshStudentFastq(student);
}
form.addEventListener('submit',event=>{event.preventDefault();if(busy||!form.reportValidity())return;const file=document.getElementById('file').files[0];if(!file||file.size>20*1024*1024){status.textContent='20 MB 이하 FASTA 파일을 선택하세요.';return;}busy=true;button.disabled=true;status.textContent='FASTA 저장 및 FASTQ 생성 중입니다. 사진은 잠시 기다려 주세요.';
 google.script.run.withSuccessHandler(result=>{busy=false;button.disabled=false;if(!result||result.ok!==true||!result.studentId){status.textContent='저장 확인을 받지 못했습니다. 다시 시도하세요.';return;}status.textContent='제출 완료\n파일: '+result.filename;const link=document.getElementById('week12');link.href='https://bbl.stdbioelec.com/courses/molecular-information-engineering/week12/fastq/index.html?student='+encodeURIComponent(result.studentId);link.hidden=false;generation(result.studentId,result.fastq);}).withFailureHandler(error=>{busy=false;button.disabled=false;status.textContent='제출 실패: '+error.message;}).submitAssignment(form);
});
</script></body></html>
