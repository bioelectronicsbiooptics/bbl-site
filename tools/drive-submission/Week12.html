<!doctype html><html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:20px;font:16px/1.65 system-ui,sans-serif;color:#16324f}h2{font-size:21px;margin:0 0 14px}input{font:inherit;padding:9px;border:1px solid #bac8d8;border-radius:6px;width:100%}label{display:block;margin:12px 0 5px;font-weight:650}button{font:inherit;background:#16324f;border:0;border-radius:6px;padding:10px 14px;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}#status{white-space:pre-wrap;background:#f2f6fa;padding:14px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}small{display:block;color:#617389}</style></head><body><h2>내 noisy FASTQ 받기</h2><label for="receipt">학번</label><input id="receipt" autocomplete="off" placeholder="학번을 입력하세요"><div class="actions"><button id="refresh" type="button">새로고침 · FASTQ 확인</button></div><p id="status" role="status" aria-live="polite">학번을 입력하고 새로고침하세요.</p><div class="actions"><button id="download" type="button" disabled>FASTQ 전체 다운로드</button><button id="decoder" type="button" disabled>내 설정의 Decoding.m</button></div><p id="save-link"></p><small>준비가 끝나면 표시되는 저장 링크를 눌러 다운로드하세요. FASTQ는 noisy_reads.fastq로 받습니다. Decoding.m과 같은 폴더에 두고 MATLAB에서 실행하세요.</small><script>
const $=id=>document.getElementById(id);let ready=null,busy=false;const initial=__INITIAL_STUDENT__;if(initial)$('receipt').value=initial;
function api(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));}
let activeDownload='';
function save(parts,name,type){if(activeDownload)URL.revokeObjectURL(activeDownload);activeDownload=URL.createObjectURL(new Blob(parts,{type}));const a=document.createElement('a');a.href=activeDownload;a.download=name;a.target='_self';a.textContent=name+' 저장 ↓';a.style.cssText='display:inline-block;padding:12px;color:#1755a2;font-weight:700';$('save-link').replaceChildren(a);}

function controls(on){$('refresh').disabled=on;$('receipt').disabled=on;$('download').disabled=on||!ready;$('decoder').disabled=on||!ready;}
async function refresh(){if(busy)return;const receipt=$('receipt').value.trim();if(!receipt||receipt.length>40){$('status').textContent='올바른 학번을 입력하세요.';return;}busy=true;ready=null;controls(true);try{$('status').textContent='FASTQ 확인 중입니다…';const result=await api('refreshStudentFastq',receipt);if(result.status!=='ready'){$('status').textContent=result.status==='failed'?'생성 오류 · 담당 교수에게 문의하세요.':result.status==='processing'?'FASTQ 생성 중입니다.':'FASTQ 생성 대기 중입니다.';return;}ready={...result,receipt};$('status').textContent='생성 완료\n원본: '+result.filename+'\nFASTQ: '+result.bytes.toLocaleString()+' bytes';}catch(e){$('status').textContent='확인 실패: '+e.message;}finally{busy=false;controls(false);}}
$('refresh').onclick=refresh;$('receipt').oninput=()=>{ready=null;controls(false);};
$('download').onclick=async()=>{if(!ready||busy)return;busy=true;controls(true);const job=ready;try{const parts=[];for(let i=0;i<job.partCount;i++){$('status').textContent='FASTQ 다운로드 준비 '+(i+1)+'/'+job.partCount;const p=await api('downloadFastqPart',job.receiptId,i),raw=atob(p.data),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(bytes.length!==p.bytes)throw Error('파일 길이 확인 실패');parts.push(bytes);}save(parts,'noisy_reads.fastq','text/plain');$('status').textContent='FASTQ 준비 완료 · 아래 noisy_reads.fastq 저장 링크를 누르세요.';}catch(e){$('status').textContent='다운로드 실패: '+e.message;}finally{busy=false;controls(false);}};
$('decoder').onclick=async()=>{if(!ready||busy)return;busy=true;controls(true);try{const code=await api('getDecoder',ready.receiptId);save([code],'Decoding.m','text/plain');$('status').textContent='Decoding.m 준비 완료 · 아래 저장 링크를 누르세요.';}catch(e){$('status').textContent=e.message;}finally{busy=false;controls(false);}};
if(initial)refresh();
</script></body></html>
