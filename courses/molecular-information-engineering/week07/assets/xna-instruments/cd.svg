<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="원편광 이색성 장비와 좌우 흡광 차이"><title>원편광 이색성 장비와 좌우 흡광 차이</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#224EBD"/></marker></defs><rect width="920" height="320" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="10" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="105.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">광원·단색화</text><text x="105.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">파장을 순서대로 선택</text><path d="M205,55 L238,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="245" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="340.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">편광 조절</text><text x="340.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">좌·우 원편광 교대</text><path d="M440,55 L473,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="575.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">시료 셀</text><text x="575.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">XNA 또는 복합체</text><path d="M675,55 L708,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="715" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="810.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">검출·차이 계산</text><text x="810.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">ΔA = Aᴸ − Aᴿ</text><rect x="35" y="135" width="245" height="122" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="157.5" y="166" font-size="19" fill="#16324F" text-anchor="middle">좌원편광 흡광 Aᴸ</text><text x="157.5" y="193" font-size="15" fill="#5B6670" text-anchor="middle">왼쪽 회전 성분에 대한 흡수</text><rect x="340" y="135" width="245" height="122" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="462.5" y="166" font-size="19" fill="#16324F" text-anchor="middle">우원편광 흡광 Aᴿ</text><text x="462.5" y="193" font-size="15" fill="#5B6670" text-anchor="middle">오른쪽 회전 성분에 대한 흡수</text><path d="M285,192 L330,192" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="175" font-size="24" fill="#16324F" text-anchor="middle">−</text><rect x="645" y="135" width="245" height="122" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="767.5" y="166" font-size="19" fill="#16324F" text-anchor="middle">파장별 차이 = CD</text><text x="767.5" y="193" font-size="15" fill="#5B6670" text-anchor="middle">나선·스태킹 변화의 지문</text><path d="M592,192 L637,192" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><text x="460" y="300" font-size="21" fill="#16324F" text-anchor="middle">동일 농도·광로·버퍼로 비교 → 스펙트럼 모양 해석</text></g></svg>