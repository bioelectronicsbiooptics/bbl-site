<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="질량분석의 이온화 분리 검출과 해석 한계"><title>질량분석의 이온화 분리 검출과 해석 한계</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#224EBD"/></marker></defs><rect width="920" height="320" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="10" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="105.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">이온화</text><text x="105.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">MALDI 또는 ESI</text><path d="M205,55 L238,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="245" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="340.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">질량 분석부</text><text x="340.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">TOF 등에서 m/z 분리</text><path d="M440,55 L473,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="575.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">검출기</text><text x="575.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">이온 신호 기록</text><path d="M675,55 L708,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="715" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="810.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">이론값과 대조</text><text x="810.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">분자량·전하·부가이온</text><path d="M60 260 H540 M60 260 V130" stroke="#16324F" stroke-width="2" fill="none"/><path d="M150 260 V220 M290 260 V150 M330 260 V235 M440 260 V245" stroke="#224EBD" stroke-width="4"/><text x="290" y="137" font-size="17" fill="#16324F" text-anchor="middle">목표 질량 후보</text><text x="310" y="292" font-size="18" fill="#16324F" text-anchor="middle">m/z →</text><text x="155" y="201" font-size="15" fill="#5B6670" text-anchor="middle">짧은 산물?</text><text x="680" y="160" font-size="20" fill="#16324F" text-anchor="middle">같은 조성 · 다른 염기 순서</text><text x="680" y="197" font-size="19" fill="#C03B3B" text-anchor="middle">→ intact mass가 같을 수 있음</text><text x="680" y="244" font-size="17" fill="#16324F" text-anchor="middle">서열·위치는 MS/MS 또는</text><text x="680" y="272" font-size="17" fill="#16324F" text-anchor="middle">호환 시퀀싱 등으로 추가 확인</text></g></svg>