<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="UV–Vis 장비 광로와 열용융 곡선"><title>UV–Vis 장비 광로와 열용융 곡선</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#224EBD"/></marker></defs><rect width="920" height="320" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="10" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="105.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">UV 광원·파장 선택</text><text x="105.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">260 nm</text><path d="M205,55 L238,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="245" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="340.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">온도 제어 큐벳</text><text x="340.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">XNA + 상보 가닥</text><path d="M440,55 L473,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="575.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">검출기</text><text x="575.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">투과광 I 측정</text><path d="M675,55 L708,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="715" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="810.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">온도별 흡광도</text><text x="810.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">A = −log₁₀(I/I₀)</text><text x="165" y="150" font-size="18" fill="#16324F" text-anchor="middle">버퍼 blank를 같은 조건으로 측정</text><text x="165" y="181" font-size="16" fill="#5B6670" text-anchor="middle">염 농도 · 가닥 농도 · 가열 속도 기록</text><text x="165" y="215" font-size="18" fill="#16324F" text-anchor="middle">가열 ↔ 냉각 곡선도 비교</text><text x="165" y="247" font-size="16" fill="#5B6670" text-anchor="middle">비가역 전이면 단순 평형 모델 주의</text><path d="M420 275 H870 M420 275 V125" stroke="#16324F" fill="none" stroke-width="2"/><path d="M435 255 C570 255 570 240 625 200 S675 135 855 135" stroke="#224EBD" fill="none" stroke-width="4"/><path d="M420 195 H630 V275" stroke="#C03B3B" stroke-dasharray="5 5" fill="none"/><text x="640" y="305" font-size="16" fill="#16324F" text-anchor="middle">온도</text><text x="405" y="140" font-size="16" fill="#16324F" text-anchor="middle">A₂₆₀</text><text x="648" y="186" font-size="18" fill="#C03B3B" text-anchor="middle">Tm</text><text x="770" y="245" font-size="15" fill="#5B6670" text-anchor="middle">교육용 곡선 · 실측값 아님</text></g></svg>