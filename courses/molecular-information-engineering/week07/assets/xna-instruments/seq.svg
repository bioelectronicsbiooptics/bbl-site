<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="XNA 간접 시퀀싱과 직접 판독 연구의 구분"><title>XNA 간접 시퀀싱과 직접 판독 연구의 구분</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#224EBD"/></marker></defs><rect width="920" height="320" fill="white"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="10" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="105.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">XNA 원본</text><text x="105.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">변형된 당·골격</text><path d="M205,55 L238,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="245" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="340.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">호환 효소로 전사</text><text x="340.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">XNA → cDNA</text><path d="M440,55 L473,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="480" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="575.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">PCR · Sanger / NGS</text><text x="575.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">DNA를 읽는 장비</text><path d="M675,55 L708,55" fill="none" stroke="#224EBD" stroke-width="3" marker-end="url(#arrow)"/><rect x="715" y="16" width="190" height="78" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="810.0" y="47" font-size="19" fill="#16324F" text-anchor="middle">염기서열 추정</text><text x="810.0" y="74" font-size="15" fill="#5B6670" text-anchor="middle">전사·증폭 오류 고려</text><rect x="25" y="140" width="420" height="125" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="235.0" y="171" font-size="19" fill="#16324F" text-anchor="middle">간접 판독</text><text x="235.0" y="198" font-size="15" fill="#5B6670" text-anchor="middle">cDNA에는 원본의 모든 화학 변형이 보존되지 않음</text><text x="235" y="245" font-size="18" fill="#16324F" text-anchor="middle">염기 정보와 화학 구조 확인은 별개</text><rect x="475" y="140" width="420" height="125" rx="12" fill="#EAF3FB" stroke="#A8C4D4"/><text x="685.0" y="171" font-size="19" fill="#16324F" text-anchor="middle">직접 판독 연구</text><text x="685.0" y="198" font-size="15" fill="#5B6670" text-anchor="middle">공학 효소 기반 Sanger · nanopore 전류</text><text x="685" y="245" font-size="18" fill="#16324F" text-anchor="middle">지원 XNA와 학습·검증 조건을 확인</text><text x="460" y="302" font-size="21" fill="#16324F" text-anchor="middle">어떤 XNA든 일반 DNA 장비에 넣으면 읽히는 것은 아니다</text></g></svg>