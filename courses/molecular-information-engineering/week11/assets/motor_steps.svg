<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <title>helicase가 DNA를 한 염기씩 포어로 넣는 과정</title>
  <rect x="0" y="0" width="520" height="320" fill="#FFFFFF"/>

  <!-- 막 -->
  <rect x="0" y="196" width="520" height="30" fill="#5B6670" fill-opacity="0.28"/>
  <text x="4" y="215" font-size="10" fill="#5B6670">막</text>
  <text x="4" y="40" font-size="11" fill="#16324F">cis</text>
  <text x="4" y="262" font-size="11" fill="#16324F">trans</text>

  <!-- 포어 3개 (CsgG 단순화) -->
  <g fill="#2E7D54">
    <path d="M60,188 L84,188 L84,234 L66,234 Z"/><path d="M120,188 L96,188 L96,234 L114,234 Z"/>
    <path d="M230,188 L254,188 L254,234 L236,234 Z"/><path d="M290,188 L266,188 L266,234 L284,234 Z"/>
    <path d="M400,188 L424,188 L424,234 L406,234 Z"/><path d="M460,188 L436,188 L436,234 L454,234 Z"/>
  </g>

  <!-- (a) 리더가 포어로 끌려감, helicase는 아직 비활성 -->
  <g stroke-width="2.4" fill="none">
    <path d="M86,30 L86,112" stroke="#16324F"/>
    <path d="M94,30 L94,112" stroke="#224EBD"/>
  </g>
  <g stroke="#5B6670" stroke-width="1"><path d="M86,40 L94,40 M86,52 L94,52 M86,64 L94,64 M86,76 L94,76 M86,88 L94,88 M86,100 L94,100"/></g>
  <ellipse cx="90" cy="130" rx="20" ry="16" fill="#C03B3B"/>
  <path d="M90,146 C90,160 88,170 90,188 L90,262" stroke="#5B6670" stroke-width="2.2" stroke-dasharray="4 3" fill="none"/>
  <text x="90" y="282" font-size="12" font-weight="700" fill="#16324F" text-anchor="middle">(a) 포획</text>
  <text x="90" y="297" font-size="10" fill="#16324F" text-anchor="middle">리더가 전압에 끌려 들어감</text>
  <text x="116" y="126" font-size="10" fill="#C03B3B">helicase</text>
  <text x="116" y="139" font-size="10" fill="#C03B3B">(아직 멈춤)</text>
  <text x="98" y="176" font-size="10" fill="#5B6670">리더</text>

  <!-- (b) helicase가 포어에 닿아 활성화 -->
  <g stroke-width="2.4" fill="none">
    <path d="M256,58 L256,158" stroke="#16324F"/>
    <path d="M264,58 L264,158" stroke="#224EBD"/>
  </g>
  <g stroke="#5B6670" stroke-width="1"><path d="M256,70 L264,70 M256,82 L264,82 M256,94 L264,94 M256,106 L264,106 M256,118 L264,118 M256,130 L264,130 M256,142 L264,142"/></g>
  <ellipse cx="260" cy="174" rx="22" ry="15" fill="#C03B3B"/>
  <path d="M260,189 L260,262" stroke="#5B6670" stroke-width="2.2" stroke-dasharray="4 3" fill="none"/>
  <text x="260" y="282" font-size="12" font-weight="700" fill="#16324F" text-anchor="middle">(b) 활성화</text>
  <text x="260" y="297" font-size="10" fill="#16324F" text-anchor="middle">포어에 닿으면 ATP로 움직이기 시작</text>
  <text x="286" y="170" font-size="10" fill="#C03B3B">포어보다 커서</text>
  <text x="286" y="183" font-size="10" fill="#C03B3B">못 들어감</text>
  <text x="226" y="120" font-size="11" fill="#2E7D54" text-anchor="end">+ ATP</text>

  <!-- (c) 두 가닥을 풀며 한 가닥만 한 칸씩 통과 -->
  <g stroke-width="2.4" fill="none">
    <path d="M426,30 L426,140" stroke="#16324F"/>
    <path d="M434,30 L434,140" stroke="#224EBD"/>
  </g>
  <g stroke="#5B6670" stroke-width="1"><path d="M426,40 L434,40 M426,52 L434,52 M426,64 L434,64 M426,76 L434,76 M426,88 L434,88 M426,100 L434,100 M426,112 L434,112 M426,124 L434,124"/></g>
  <!-- 풀린 상보 가닥 -->
  <path d="M434,140 C448,150 470,146 482,128 C492,114 500,112 510,116" stroke="#224EBD" stroke-width="2.4" fill="none"/>
  <!-- 주형 가닥이 포어로 -->
  <path d="M426,140 L430,160" stroke="#16324F" stroke-width="2.4" fill="none"/>
  <ellipse cx="430" cy="174" rx="22" ry="15" fill="#C03B3B"/>
  <path d="M430,189 L430,268" stroke="#16324F" stroke-width="2.4" fill="none"/>
  <path d="M430,240 C430,252 426,258 430,268" stroke="#5B6670" stroke-width="2.2" stroke-dasharray="4 3" fill="none"/>
  <text x="430" y="282" font-size="12" font-weight="700" fill="#16324F" text-anchor="middle">(c) 한 염기씩 통과</text>
  <text x="430" y="297" font-size="10" fill="#16324F" text-anchor="middle">5′→3′로 걸으며 이중가닥을 풂</text>
  <text x="476" y="90" font-size="10" fill="#224EBD" text-anchor="middle">상보 가닥은</text>
  <text x="476" y="103" font-size="10" fill="#224EBD" text-anchor="middle">cis에 남음</text>
  <text x="402" y="146" font-size="10" fill="#C03B3B" text-anchor="end">ATP 1개 ≈ 1 nt</text>
  <text x="440" y="252" font-size="10" fill="#16324F">~450 b/s</text>

  <!-- 전압 방향 -->
  <path d="M168,238 L168,270" stroke="#224EBD" stroke-width="1.6"/>
  <path d="M163,264 L168,274 L173,264 Z" fill="#224EBD"/>
  <text x="176" y="252" font-size="10" fill="#224EBD">전압(~180 mV)이</text>
  <text x="176" y="265" font-size="10" fill="#224EBD">음전하 가닥을 당김</text>

  <text x="514" y="316" font-size="8.5" fill="#5B6670" text-anchor="end">Branton &amp; Deamer (2019) Fig. 5.3 재구성 (63–64쪽)</text>
</svg>
