<text x="558.0" y="412.5" font-size="13" fill="#1A1A1A" text-anchor="start">성공 · index 일치 → 행 확보<tspan font-family="Menlo,Consolas,monospace" fill="#5B6670" dx="8">global</tspan></text>
<circle cx="544" cy="428.0" r="8" fill="#C03B3B"/><path d="M539.5,428.0 H548.5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="558.0" y="432.5" font-size="13" fill="#1A1A1A" text-anchor="start">실패 → 실패 묶음 목록</text>
