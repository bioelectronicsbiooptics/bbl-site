<path d="M534,612.0 H528 V632.0 H534" fill="none" stroke="#9AA4AE" stroke-width="1.2"/>
<circle cx="544" cy="612.0" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="544" cy="612.0" r="2.8" fill="#5B6670"/>
<text x="558.0" y="616.5" font-size="13" fill="#1A1A1A" text-anchor="start">행 2..D 이어 붙여 앞 L byte</text>
<circle cx="544" cy="632.0" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="544" cy="632.0" r="2.8" fill="#5B6670"/>
<text x="558.0" y="636.5" font-size="13" fill="#1A1A1A" text-anchor="start">CRC-32 비교 → 일치 여부 보고</text>
