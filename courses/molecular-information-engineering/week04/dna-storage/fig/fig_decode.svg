<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 748" role="img" aria-labelledby="fdec-t">
<title id="fdec-t">불러오기(복호) 깔때기: read 전체에서 방향 맞추기, PrimerSort, iSCAN, consensus, Global RS, Local RS, XOR 복원, 헤더 확인을 거쳐 파일로 가는 단계와 단계마다 탈락하거나 복원되는 것</title>
<defs>
<marker id="fdec-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16324F"/></marker>
</defs>
<rect x="0" y="0" width="880" height="748" fill="#FFFFFF"/>
<g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
<circle cx="536" cy="21.5" r="8" fill="#2E7D54"/><path d="M531.5,21.5 H540.5 M536,17.0 V26.0" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="550.0" y="26.0" font-size="13" fill="#1A1A1A" text-anchor="start">복원 · 확보</text>
