<text x="282.0" y="481.0" font-size="15" fill="#16324F" text-anchor="middle" font-weight="700">Local RS</text>
<text x="282.0" y="502.0" font-size="13" fill="#1A1A1A" text-anchor="middle">실패 묶음의 read를 하나씩 RS 복호</text>
<line x1="437.1" y1="486.0" x2="528" y2="486.0" stroke="#9AA4AE" stroke-width="1.2"/>
