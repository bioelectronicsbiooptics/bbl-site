<text x="558.0" y="480.5" font-size="13" fill="#1A1A1A" text-anchor="start">통과 read끼리 byte 최빈값 → 행 확보<tspan font-family="Menlo,Consolas,monospace" fill="#5B6670" dx="8">local</tspan></text>
<circle cx="544" cy="496.0" r="8" fill="#C03B3B"/><path d="M539.5,496.0 H548.5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="558.0" y="500.5" font-size="13" fill="#1A1A1A" text-anchor="start">통과 read 없음 → 빈 행으로 남음</text>
<polygon points="136.9,524 427.1,524 417.7,584 146.3,584" fill="#FFF4DC" stroke="#8A5F12" stroke-width="1.5" stroke-linejoin="round"/>
