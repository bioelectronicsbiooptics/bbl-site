<text x="282.0" y="704.0" font-size="15" fill="#2E7D54" text-anchor="middle" font-weight="700">파일</text>
<text x="282.0" y="723.0" font-size="13" fill="#1A1A1A" text-anchor="middle">이름 · 사진 · byte 그대로</text>
<line x1="411.0" y1="708.0" x2="528" y2="708.0" stroke="#9AA4AE" stroke-width="1.2"/>
<path d="M534,698.0 H528 V718.0 H534" fill="none" stroke="#9AA4AE" stroke-width="1.2"/>
<circle cx="544" cy="698.0" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="544" cy="698.0" r="2.8" fill="#5B6670"/>
<text x="558.0" y="702.5" font-size="13" fill="#1A1A1A" text-anchor="start">빈 행 = 0x00 → 부분 복원도 출력</text>
<circle cx="544" cy="718.0" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="544" cy="718.0" r="2.8" fill="#5B6670"/>
<text x="558.0" y="722.5" font-size="13" fill="#1A1A1A" text-anchor="start">whitening 켬: 해제 뒤 빈 행 = 마스크 값</text>
