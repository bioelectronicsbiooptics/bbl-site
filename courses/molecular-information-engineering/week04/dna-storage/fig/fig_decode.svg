<text x="282.0" y="570.0" font-size="13" fill="#1A1A1A" text-anchor="middle">(j, j+H, D+j) 중 하나만 없으면 채움</text>
<line x1="426.4" y1="554.0" x2="528" y2="554.0" stroke="#9AA4AE" stroke-width="1.2"/>
<path d="M534,534.0 H528 V574.0 H534" fill="none" stroke="#9AA4AE" stroke-width="1.2"/>
