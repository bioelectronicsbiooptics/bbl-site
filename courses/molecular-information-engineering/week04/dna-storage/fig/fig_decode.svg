<text x="558.0" y="538.5" font-size="13" fill="#1A1A1A" text-anchor="start">D = 헤더 값 (없으면 확보 행 최대 index로 추정)</text>
<circle cx="544" cy="554.0" r="8" fill="#2E7D54"/><path d="M539.5,554.0 H548.5 M544,549.5 V558.5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="558.0" y="558.5" font-size="13" fill="#1A1A1A" text-anchor="start">빈 1개 = 나머지 두 행의 ⊕<tspan font-family="Menlo,Consolas,monospace" fill="#5B6670" dx="8">xor</tspan></text>
<circle cx="544" cy="574.0" r="8" fill="#C03B3B"/><path d="M539.5,574.0 H548.5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="558.0" y="578.5" font-size="13" fill="#1A1A1A" text-anchor="start">2개 이상 없음 → 복원 불가 · 번호 보고</text>
<polygon points="147.6,592 416.4,592 407.0,652 157.0,652" fill="#16324F" stroke="#16324F" stroke-width="1.5" stroke-linejoin="round"/>
<text x="282.0" y="617.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">헤더 (1번 행 · XOR 복원 포함)</text>
<text x="282.0" y="638.0" font-size="13" fill="#FFFFFF" text-anchor="middle">길이 L · CRC-32 · ext 읽기</text>
