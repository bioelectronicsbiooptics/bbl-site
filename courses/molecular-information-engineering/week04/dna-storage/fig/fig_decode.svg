<text x="659.8" y="26.0" font-size="13" fill="#1A1A1A" text-anchor="start">탈락 · 실패</text>
<circle cx="755.5" cy="21.5" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="755.5" cy="21.5" r="2.8" fill="#5B6670"/>
<text x="769.5" y="26.0" font-size="13" fill="#1A1A1A" text-anchor="start">변환 · 확인</text>
<text x="282.0" y="26.0" font-size="15" fill="#16324F" text-anchor="middle" font-weight="700">단계</text>
<polygon points="62.0,48 502.0,48 492.6,108 71.4,108" fill="#F4F6F9" stroke="#5B6670" stroke-width="1.5" stroke-linejoin="round"/>
<text x="282.0" y="73.0" font-size="15" fill="#16324F" text-anchor="middle" font-weight="700">read 전체</text>
<text x="282.0" y="94.0" font-size="13" fill="#1A1A1A" text-anchor="middle">정방향 + 역방향 read 섞임 · 순서 무작위</text>
<line x1="501.3" y1="78.0" x2="533" y2="78.0" stroke="#9AA4AE" stroke-width="1.2"/>
<circle cx="544" cy="78.0" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="544" cy="78.0" r="2.8" fill="#5B6670"/>
<text x="558.0" y="82.5" font-size="13" fill="#1A1A1A" text-anchor="start">품질 점수는 쓰지 않고 서열만 읽음</text>
<polygon points="72.7,116 491.3,116 481.9,176 82.1,176" fill="#E9EDF2" stroke="#5B6670" stroke-width="1.5" stroke-linejoin="round"/>
<text x="282.0" y="141.0" font-size="15" fill="#16324F" text-anchor="middle" font-weight="700">방향 맞추기</text>
<text x="282.0" y="162.0" font-size="13" fill="#1A1A1A" text-anchor="middle">앞 20 nt ↔ F · 안 맞으면 역상보로 다시 비교</text>
<line x1="490.6" y1="146.0" x2="528" y2="146.0" stroke="#9AA4AE" stroke-width="1.2"/>
<path d="M534,136.0 H528 V156.0 H534" fill="none" stroke="#9AA4AE" stroke-width="1.2"/>
<circle cx="544" cy="136.0" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="544" cy="136.0" r="2.8" fill="#5B6670"/>
<text x="558.0" y="140.5" font-size="13" fill="#1A1A1A" text-anchor="start">역방향 read → 역상보로 뒤집어 살림<tspan font-family="Menlo,Consolas,monospace" fill="#5B6670" dx="8">reversed</tspan></text>
<circle cx="544" cy="156.0" r="8" fill="#C03B3B"/><path d="M539.5,156.0 H548.5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="558.0" y="160.5" font-size="13" fill="#1A1A1A" text-anchor="start">F · 역상보 모두 &lt; 18/20 → 탈락<tspan font-family="Menlo,Consolas,monospace" fill="#5B6670" dx="8">no_primer</tspan></text>
<polygon points="83.4,184 480.6,184 471.2,244 92.8,244" fill="#E9EDF2" stroke="#5B6670" stroke-width="1.5" stroke-linejoin="round"/>
<text x="282.0" y="209.0" font-size="15" fill="#16324F" text-anchor="middle" font-weight="700">PrimerSort</text>
<text x="282.0" y="230.0" font-size="13" fill="#1A1A1A" text-anchor="middle">129–148 nt ↔ R (≥ 18/20) · 앞 148 nt만 남김</text>
<line x1="479.9" y1="214.0" x2="528" y2="214.0" stroke="#9AA4AE" stroke-width="1.2"/>
<path d="M534,204.0 H528 V224.0 H534" fill="none" stroke="#9AA4AE" stroke-width="1.2"/>
<circle cx="544" cy="204.0" r="8" fill="#C03B3B"/><path d="M539.5,204.0 H548.5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="558.0" y="208.5" font-size="13" fill="#1A1A1A" text-anchor="start">삽입 · 결실 read 대부분 탈락<tspan font-family="Menlo,Consolas,monospace" fill="#5B6670" dx="8">bad_length</tspan></text>
<text x="558.0" y="228.5" font-size="13" fill="#5B6670" text-anchor="start">길이 &lt; 148 또는 R 자리 어긋남</text>
<polygon points="94.1,252 469.9,252 460.5,312 103.5,312" fill="#224EBD" stroke="#224EBD" stroke-width="1.5" stroke-linejoin="round"/>
<text x="282.0" y="277.0" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">iSCAN</text>
<text x="282.0" y="298.0" font-size="13" fill="#FFFFFF" text-anchor="middle">RS 풀지 않고 index(본문 69–76 nt)만 읽어 묶음</text>
<line x1="469.2" y1="282.0" x2="528" y2="282.0" stroke="#9AA4AE" stroke-width="1.2"/>
<path d="M534,272.0 H528 V292.0 H534" fill="none" stroke="#9AA4AE" stroke-width="1.2"/>
<circle cx="544" cy="272.0" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="544" cy="272.0" r="2.8" fill="#5B6670"/>
<text x="558.0" y="276.5" font-size="13" fill="#1A1A1A" text-anchor="start">같은 index = 한 묶음 · 묶음 크기 = depth</text>
<circle cx="544" cy="292.0" r="8" fill="#C03B3B"/><path d="M539.5,292.0 H548.5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="558.0" y="296.5" font-size="13" fill="#1A1A1A" text-anchor="start">index = 0 → 탈락</text>
<polygon points="104.8,320 459.2,320 449.8,380 114.2,380" fill="#EAF3FB" stroke="#529FD9" stroke-width="1.5" stroke-linejoin="round"/>
<text x="282.0" y="345.0" font-size="15" fill="#16324F" text-anchor="middle" font-weight="700">consensus</text>
<text x="282.0" y="366.0" font-size="13" fill="#1A1A1A" text-anchor="middle">묶음마다 108 자리별 최다 염기</text>
<line x1="458.5" y1="350.0" x2="528" y2="350.0" stroke="#9AA4AE" stroke-width="1.2"/>
<path d="M534,340.0 H528 V360.0 H534" fill="none" stroke="#9AA4AE" stroke-width="1.2"/>
<circle cx="544" cy="340.0" r="7.5" fill="#FFFFFF" stroke="#5B6670" stroke-width="1.5"/><circle cx="544" cy="340.0" r="2.8" fill="#5B6670"/>
<text x="558.0" y="344.5" font-size="13" fill="#1A1A1A" text-anchor="start">묶음 하나 → 대표 서열 하나</text>
<circle cx="544" cy="360.0" r="8" fill="#2E7D54"/><path d="M539.5,360.0 H548.5 M544,355.5 V364.5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
<text x="558.0" y="364.5" font-size="13" fill="#1A1A1A" text-anchor="start">read마다 흩어진 치환 → 다수결로 지움</text>
<polygon points="115.5,388 448.5,388 439.1,448 124.9,448" fill="#FBECEC" stroke="#C03B3B" stroke-width="1.5" stroke-linejoin="round"/>
<text x="282.0" y="413.0" font-size="15" fill="#16324F" text-anchor="middle" font-weight="700">Global RS</text>
<text x="282" y="434" font-size="13" fill="#1A1A1A" text-anchor="middle">대표 서열 RS 복호 → <tspan fill="#2E7D54" font-weight="700">성공 행</tspan><tspan fill="#5B6670"> / </tspan><tspan fill="#C03B3B" font-weight="700">실패 행</tspan></text>
<line x1="447.8" y1="418.0" x2="528" y2="418.0" stroke="#9AA4AE" stroke-width="1.2"/>
<path d="M534,408.0 H528 V428.0 H534" fill="none" stroke="#9AA4AE" stroke-width="1.2"/>
