<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" role="img" aria-labelledby="kf-t">
<title id="kf-t">원본 KIS 가닥은 RS 부호화 뒤 빈자리를 TGCA 무늬로 덮어써 패리티가 내용과 맞지 않고, 수정판 DNAS-1은 헤더와 PAD를 RS 전에 채워 부호어를 그대로 둠</title>
<defs><pattern id="kf-pad" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#EAF3FB"/><line x1="0" y1="0" x2="0" y2="6" stroke="#529FD9" stroke-width="1.4"/></pattern></defs>
<rect x="0" y="0" width="880" height="590" fill="#FFFFFF"/>
<text x="16" y="28" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#16324F" text-anchor="start" font-weight="700">원본 (STL_Encode.m 53–108행)</text>
<text x="262" y="28" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5B6670" text-anchor="start">KIS 가닥 = 마지막 행 (J6 index 1018)</text>
<text x="16" y="56" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5B6670" text-anchor="start">KIS 메시지 156 심볼 (심볼 1개 = 1 bit)</text>
<text x="508" y="56" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5B6670" text-anchor="start">DNA 110 nt (89–99행)</text>
