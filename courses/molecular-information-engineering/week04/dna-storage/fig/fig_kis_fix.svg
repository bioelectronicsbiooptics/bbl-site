<text x="832.0" y="85.68" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#C03B3B" text-anchor="middle">패리티</text>
<rect x="590" y="63" width="108" height="36" fill="none" stroke="#C03B3B" stroke-width="2.2"/>
