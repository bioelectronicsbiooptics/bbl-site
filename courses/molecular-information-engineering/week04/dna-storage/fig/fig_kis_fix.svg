<text x="508" y="128" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" fill="#C03B3B" text-anchor="start" font-weight="700">RS 뒤에 빈자리를 TGCA 무늬로 덮어씀</text>
<text x="508" y="148" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5B6670" text-anchor="start">101–108행 · J6 1018번 가닥 부호어 43–68 nt</text>
<rect x="380" y="170" width="484" height="58" rx="5" fill="#FFFFFF" stroke="#C03B3B" stroke-width="1.6"/>
<circle cx="404" cy="199" r="11" fill="#C03B3B"/>
<path d="M399,194 l10,10 M409,194 l-10,10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
<text x="426" y="194" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" fill="#1A1A1A" text-anchor="start" font-weight="700">패리티 ≠ 내용 (J6: 메시지 심볼 26개 불일치, t = 4) → RS 복호 불가</text>
<text x="426" y="215" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" fill="#1A1A1A" text-anchor="start">→ KeyFind가 AAAAA · TGCA 무늬로 따로 탐색</text>
<line x1="16" y1="250" x2="864" y2="250" stroke="#D8DEE6" stroke-width="1.2"/>
<text x="16" y="280" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#16324F" text-anchor="start" font-weight="700">수정판 DNAS-1</text>
<text x="140" y="280" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5B6670" text-anchor="start">헤더 가닥 = 1번 행 · 부호어 = 메시지 19 B ‖ 패리티 8 B</text>
<text x="16" y="306" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5B6670" text-anchor="start">행 1 = 헤더 17 B (version · type · 길이 L · CRC-32 · D · flags · ext)</text>
<text x="16" y="360" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5B6670" text-anchor="start">마지막 파일 행 r = 파일 byte + 빈자리 PAD 0x1B</text>
